apiVersion: v1
kind: ConfigMap
metadata:
  # Deprecated in v4.2, use a WorkflowArtifactRepository instead.
  # This config map is kept to test the deprecated artifactRepositoryRef.configMap and artifactRepositoryRef.key.
  name: artifact-repositories
data:
  my-key: |
    archiveLogs: true
    s3:
      bucket: my-bucket
      endpoint: minio:9000
      insecure: true
      accessKeySecret:
        name: my-minio-cred
        key: accesskey
      secretKeySecret:
        name: my-minio-cred
        key: secretkey
  empty: ""
